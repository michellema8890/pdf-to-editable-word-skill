[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-editable-word"
version = "0.1.0"
description = "Portable Agent Skill for converting PDF to editable Word/DOCX while preserving layout; supports Codex, Claude Code, other AI agents, and local CLI use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pdf-to-editable-word contributors" }]
keywords = [
  "pdf-to-word",
  "pdf-to-docx",
  "editable-word",
  "layout-preserving",
  "document-conversion",
  "agent-skills",
  "codex-skill",
  "claude-code-skill",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pdfplumber>=0.11.4,<0.12",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "reportlab>=4,<5",
]

[project.scripts]
pdf2word = "pdf_to_editable_word.cli:main"

[project.urls]
Homepage = "https://github.com/longligooo/pdf-to-editable-word-skill"
Issues = "https://github.com/longligooo/pdf-to-editable-word-skill/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_to_editable_word = [
  "bundled_skill/SKILL.md",
  "bundled_skill/agents/*.yaml",
  "bundled_skill/references/*.md",
  "bundled_skill/scripts/*.py",
]
